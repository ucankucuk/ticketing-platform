# Kök uygulama (app-of-apps, ADR-0019).
# apps/ dizinindeki her Application tanımını cluster'a uygular.
# Yeni bir platform bileşeni eklemek için apps/ altına bir Application dosyası eklemek yeterli.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ucankucuk/ticketing-platform.git
    targetRevision: main
    path: deploy/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
