# Argo CD kurulumu (ADR-0019).
# Argo CD'nin resmi, sürüme sabitlenmiş manifesti temel alınır; özelleştirmeler
# Kustomize yamalarıyla yapılır. Bu dizini ilk kurulumda betik uygular,
# sonrasında Argo CD kendini buradan yönetir (apps/argocd.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.6.2/manifests/install.yaml
