name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# En az yetki ilkesi: iş akışları varsayılan olarak yalnızca okuma yetkisi alır.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ve test (Java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Java 25 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Maven verify
        run: mvn --batch-mode --no-transfer-progress verify

  cluster-smoke:
    name: Kind cluster smoke testi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Yalnızca kind'ı kurar; cluster'ı yereldeki betikle aynı şekilde oluşturuyoruz.
      - name: kind kur
        uses: helm/kind-action@v1
        with:
          install_only: true

      # Yerelde kullanılan cluster ve Cilium kurulumunun CI'da da ayağa kalktığını doğrular.
      - name: Cluster ve Cilium kurulumu
        run: ./scripts/cluster-up.sh

      - name: Düğümleri ve Cilium'u doğrula
        run: |
          test "$(kubectl get nodes --no-headers | wc -l)" -eq 4
          kubectl -n kube-system get pods -l k8s-app=cilium -o wide
          # kube-proxy kurulmamış olmalı (ADR-0012)
          test -z "$(kubectl -n kube-system get daemonset kube-proxy --ignore-not-found -o name)"
