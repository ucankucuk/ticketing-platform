# Public Gateway'in TLS sertifikası (ADR-0018). local-ca tarafından imzalanır,
# cert-manager süresi dolmadan yeniler.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: public-gateway-tls
  namespace: gateway
spec:
  secretName: public-gateway-tls
  dnsNames:
    - ticketing.localhost
    - "*.ticketing.localhost"
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: local-ca
