# Envoy Gateway'e bağlı GatewayClass. Proxy ayarları EnvoyProxy kaynağından gelir.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: local
    namespace: gateway
